[package]
name = "tyyt"
version = "0.1.0"
edition = "2021"
description = "Lightweight GTK4 YouTube client with adblock-rust"
license = "GPL-3.0-or-later"
authors = ["tyyt contributors"]
readme = "README.md"

[dependencies]
# Disable single-thread so Engine is Send+Sync for background reloads.
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
anyhow = "1"
async-channel = "2"
dirs = "6"
gdk4 = "0.9"
gio = "0.20"
glib = "0.20"
gtk4 = { version = "0.9", package = "gtk4", features = ["v4_14"] }
ksni = "0.3"
libadwaita = { version = "0.7", features = ["v1_5"] }
once_cell = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
